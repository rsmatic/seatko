<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Variables and button styles the embed picks up (it normally inherits them from the organizer's website). */
    :root { --bg-2: #16161a; --text: #ececef; --muted: #9a9aa6; --line: #2a2a31; --accent: #d4a24c; --radius: 12px;
      --display: 'Oswald', 'Inter', sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d0d0f; color: var(--text); font: 16px/1.5 'Inter', system-ui, sans-serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .btn { display: inline-block; padding: .65rem 1.1rem; border-radius: 999px; border: 1px solid var(--line); background: transparent;
      color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1305; }
    .loading { text-align: center; color: var(--muted); padding: 3rem 0; }
  </style>
</head>
<body>
  <main>
    <div id="tickets" data-inline data-app-url="__APP_URL__"><p class="loading">Loading…</p></div>
  </main>
  <script>
    // /buy/<event id>[?onsite=1]
    var box = document.getElementById('tickets');
    box.setAttribute('data-seatko-event', location.pathname.split('/').filter(Boolean).pop());
    if (/[?&]onsite=1\b/.test(location.search)) box.setAttribute('data-channel', 'onsite');
  </script>
  <script src="/embed.js"></script>
</body>
</html>
